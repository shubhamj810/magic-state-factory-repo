<!doctype html>
<html lang="en">
<head>
<!--#head-->
<title>Factory · Magic State Factory Catalog</title>
<meta name="robots" content="noindex">
</head>
<body>
<!--#header browse-->
<main id="main">
  <h1>Moved</h1>
  <p class="lede" id="msg">Factories now live at their own address, such as <a href="f/15.1.3.a/">f/15.1.3.a/</a>. Redirecting…</p>
</main>
<!--#footer-->
<script src="js/catalog.js"></script>
<script>
/* Old links: factory.html?id=<label or old hash id> -> f/<label>/ */
(function () {
  var C = window.Catalog, id = C.query("id") || "";
  C.loadIndex().then(function (index) {
    var hit = index.factories.filter(function (f) { return f.id === id || f.legacy_id === id; })[0];
    if (hit) { window.location.replace(C.factoryHref(hit.id)); return; }
    document.getElementById("msg").innerHTML = "Could not load a factory with id <code>" + C.escapeHtml(id) +
      "</code>. <a href=\"search.html\">Search the catalogue</a> instead.";
  });
}());
</script>
</body>
</html>
