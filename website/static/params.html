<!doctype html>
<html lang="en">
<head>
<!--#head-->
<title>Parameters · Magic State Factory Catalog</title>
<meta name="robots" content="noindex">
</head>
<body>
<!--#header browse-->
<main id="main">
  <h1>Moved</h1>
  <p class="lede" id="msg">Parameter sets now live at their own address, such as <a href="p/15.1.3/">p/15.1.3/</a>. Redirecting…</p>
</main>
<!--#footer-->
<script src="js/catalog.js"></script>
<script>
/* Old links: params.html?n=..&k=..&d=.. -> p/<n.k.d>/ */
(function () {
  var C = window.Catalog, n = Number(C.query("n")), k = Number(C.query("k")), d = Number(C.query("d"));
  C.loadIndex().then(function (index) {
    var hit = index.parameters.some(function (p) { return p.n === n && p.k === k && p.d === d; });
    if (hit) { window.location.replace(C.paramsHref(n, k, d)); return; }
    document.getElementById("msg").innerHTML = "Nothing catalogued at " + C.escapeHtml(C.params(n, k, d)) +
      ". <a href=\"index.html#parameters\">Browse the parameter table</a>.";
  });
}());
</script>
</body>
</html>
